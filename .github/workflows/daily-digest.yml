name: Weekly Digest

on:
  schedule:
    # Every day 7:00 AM IST = 1:30 AM UTC.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Discord posting (test mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_MODEL: gemini-2.0-flash
          SCHEDULE_TIMEZONE: Asia/Kolkata
          DIGEST_LOOKBACK_DAYS: "7"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --run-now --dry-run
          else
            python main.py --run-now
          fi

      - name: Commit updated state back to repo
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digest.db profile.json digests/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update digest state $(date -u +'%Y-%m-%d')"
          git push
