name: Daily Digest

on:
  schedule:
    # Every day 7:00 AM IST = 1:30 AM UTC.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Discord posting (test mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  actions: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore digest.db and profile.json from cache so deduplication
      # and profile history carry over between runs without committing
      # these files to the public repo.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: |
            digest.db
            profile.json
          key: digest-state

      - name: Run digest pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_MODEL: gemini-2.0-flash
          SCHEDULE_TIMEZONE: Asia/Kolkata
          DIGEST_LOOKBACK_DAYS: "7"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --run-now --dry-run
          else
            python main.py --run-now
          fi

      # Save updated state back to cache. The delete + save pattern
      # ensures the cache is always overwritten with the latest state.
      - name: Clear previous state cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache delete digest-state --repo ${{ github.repository }} 2>/dev/null || true

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            digest.db
            profile.json
          key: digest-state

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digests/
          retention-days: 30
